schema_version: 1

context:
  name: tardigrade_error_tools
  version: 0.0.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  skip: win
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - set -x
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib # Conda-forge feedstock must replace ``-DCMAKE_INSTALL_LIBDIR=lib`` with ``${CMAKE_ARGS}``
      - cmake --build build --target tardigrade_error_tools tardigrade_error_tools_PYTHON
      - cmake --install build --prefix ${PREFIX}
      - $PYTHON -m pip install build/src/python/dist/$PKG_NAME-$PKG_VERSION.tar.gz --no-deps --ignore-installed -v --no-build-isolation
      - $PYTHON -m pip show $PKG_NAME

requirements:
  build:
    - python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - cython
    - ${{ compiler('cxx') }}  # Conda-forge feedstock also requires ``{{ stdlib('c') }}`, but this breaks the in-repo recipe.
    - make
    - cmake >=3.30
    - breathe >=4.3.0
    - clang-tools
    - doxygen
    - libboost-python-devel >=1.82
    - pip
    - python-build
    - setuptools >=77
    - setuptools_scm >=8
    - sphinx >=3.0.4
    - sphinx_rtd_theme >=0.4.3
    - sphinxcontrib-bibtex
  host:
    - python ${{ python }}.*
    - pip
    - cython
    - setuptools >=77
    - setuptools_scm >=8
  run:
    - python
  run_exports:
    - ${{ pin_subpackage(name|lower, upper_bound='x.x') }}

tests:
  - files:
      source:
        - CMakeLists.txt
        - src/cpp/tests/CMakeLists.txt
        - src/cpp/tests/test_tardigrade_error_tools.cpp
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - pytest
        - pytest-xdist
        - make
        - cmake >=3.30
        - clang-tools
        - libboost-python-devel >=1.82
        - doxygen
        - sphinx >=3.0.4
    script:
      - set -x
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=conda-test -DCMAKE_INSTALL_LIBDIR=lib
      - cmake --build build --target all --verbose --parallel 4
      - ctest --test-dir build --output-on-failure -R 'test_' --parallel 4
      - cd $SP_DIR/$PKG_NAME
      - pytest

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A collection of tools used for error handling.
  description: |
    tardigrade-error-tools A collection of tools used for error handling. These tools provide a
    linked list class which can help a user both understand where an error happened and also help the developer to
    correct for the errors.
  homepage: https://github.com/UCBoulder/tardigrade_error_tools
  repository: https://github.com/UCBoulder/tardigrade_error_tools
